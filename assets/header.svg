<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" fill="none" role="img" aria-label="Sri Ramaanuja Dasan — AI/ML Engineer">
  <rect width="840" height="220" fill="#0a0a0a"/>

  <!-- subtle moving scan line -->
  <rect x="0" y="0" width="840" height="1" fill="#ece9e3" opacity="0.05">
    <animate attributeName="y" values="0;220;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- top rule draws in -->
  <g transform="translate(48 46)">
    <rect width="744" height="1" fill="#37352f" transform="scale(0 1)">
      <animateTransform attributeName="transform" type="scale" from="0 1" to="1 1" dur="0.9s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>

  <!-- eyebrow -->
  <text x="48" y="40" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#747069" opacity="0">
    PORTFOLIO · 2026
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
  </text>

  <!-- name: rises + fades -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.25s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 30" to="0 0" dur="1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <text x="46" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#ece9e3" letter-spacing="-1">Sri Ramaanuja <tspan font-style="italic" fill="#b4b0a8">Dasan</tspan></text>
  </g>

  <!-- subtitle + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.9s" fill="freeze"/>
    <text x="48" y="168" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" letter-spacing="4" fill="#b4b0a8">AI / ML ENGINEER — I BUILD AND SHIP SYSTEMS END TO END</text>
    <rect x="636" y="156" width="9" height="15" fill="#ece9e3">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- availability pill -->
  <g transform="translate(48 192)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.2s" fill="freeze"/>
    <circle cx="4" cy="-4" r="4" fill="#ece9e3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#747069">AVAILABLE FOR INTERNSHIPS — NOV 2026</text>
  </g>
</svg>
